<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge Console</title>
    <link rel="stylesheet" href="console.css" />
  </head>
  <body>
    <header class="header">
      <div>
        <h1>Knowledge Console</h1>
        <p>Browse libraries and documents.</p>
      </div>
      <div class="actions">
        <button id="refreshBtn">Refresh</button>
      </div>
    </header>

    <main class="layout">
      <section id="listView" class="list-view">
        <div class="list-column">
          <div class="panel-header">
            <h2>Libraries</h2>
            <button id="createLibraryBtn">New</button>
          </div>
          <div class="panel-header">
            <select id="uploadLibrarySelect">
              <option value="">Select library</option>
            </select>
          <button id="uploadBtn">Upload PDF</button>
          <input id="uploadFile" type="file" accept="application/pdf" />
        </div>
          <div class="panel-header">
            <input id="librarySearch" type="text" placeholder="Search libraries" />
            <select id="librarySort">
              <option value="id_asc">Sort: ID asc</option>
              <option value="id_desc">Sort: ID desc</option>
              <option value="name_asc">Sort: Name A-Z</option>
              <option value="name_desc">Sort: Name Z-A</option>
            </select>
          </div>
          <div id="libraryList" class="list"></div>
        </div>
        <div class="list-column">
          <div class="panel-header">
            <h2>Documents</h2>
            <input id="filterInput" type="text" placeholder="Search docs" />
          </div>
          <div class="panel-header">
            <select id="documentSort">
              <option value="id_asc">Sort: ID asc</option>
              <option value="id_desc">Sort: ID desc</option>
              <option value="name_asc">Sort: Name A-Z</option>
              <option value="name_desc">Sort: Name Z-A</option>
              <option value="status_dirty">Sort: Needs re-embed</option>
            </select>
          </div>
          <div id="docList" class="list"></div>
        </div>
      </section>
    </main>

    <script src="console.js"></script>
  </body>
</html>
