<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b5cff'/%3E%3Cpath d='M17 15h23a8 8 0 0 1 8 8v26H25a8 8 0 0 1-8-8V15zm8 8v18h15V23H25z' fill='white'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const appearance = new URLSearchParams(window.location.search).get('appearance')
        const theme = appearance === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.backgroundColor = theme === 'light' ? '#f5f5f7' : '#090a0d'
      })()
    </script>
    <style>
      html, body, #app { min-height: 100%; margin: 0; background: #090a0d; }
      html[data-theme='light'], html[data-theme='light'] body, html[data-theme='light'] #app { background: #f5f5f7; }
    </style>
    <title>KB Admin Web</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
