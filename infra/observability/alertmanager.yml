global:
  resolve_timeout: 5m

route:
  receiver: agent-powflow-console
  group_by: ["alertname", "component", "severity"]
  group_wait: 15s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: agent-powflow-console
    webhook_configs:
      - url: http://execution-api:8090/api/v1/internal/alerts/alertmanager
        send_resolved: true
        max_alerts: 100
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/alertmanager-webhook-token
