global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: minio-cluster
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/minio-bearer-token
    static_configs:
      - targets: ["minio:9000"]
