services:
  postgres:
    ports: !reset []

  mongodb:
    ports: !reset []

  rabbitmq:
    ports: !reset []

  minio:
    ports: !reset []

  qdrant:
    ports: !reset []
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required in production}

  control-plane:
    ports: !reset []

  execution-api:
    ports: !reset []

  chat-plane:
    ports: !reset []

  web-app:
    build:
      dockerfile: apps/Dockerfile.production
      args:
        VITE_PUBLIC_CONSOLE_ORIGIN: ${PUBLIC_CONSOLE_ORIGIN:?PUBLIC_CONSOLE_ORIGIN is required in production}
        VITE_PUBLIC_ADMIN_ORIGIN: ${PUBLIC_ADMIN_ORIGIN:?PUBLIC_ADMIN_ORIGIN is required in production}
        VITE_PUBLIC_KB_ORIGIN: ${PUBLIC_KB_ORIGIN:?PUBLIC_KB_ORIGIN is required in production}
        VITE_PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:?PUBLIC_API_ORIGIN is required in production}
    ports: !override
      - "127.0.0.1:${WEB_APP_PORT:-5173}:8080"

  web-admin:
    build:
      dockerfile: apps/Dockerfile.production
      args:
        VITE_PUBLIC_CONSOLE_ORIGIN: ${PUBLIC_CONSOLE_ORIGIN:?PUBLIC_CONSOLE_ORIGIN is required in production}
        VITE_PUBLIC_ADMIN_ORIGIN: ${PUBLIC_ADMIN_ORIGIN:?PUBLIC_ADMIN_ORIGIN is required in production}
        VITE_PUBLIC_KB_ORIGIN: ${PUBLIC_KB_ORIGIN:?PUBLIC_KB_ORIGIN is required in production}
        VITE_PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:?PUBLIC_API_ORIGIN is required in production}
    ports: !override
      - "127.0.0.1:${WEB_ADMIN_PORT:-5174}:8080"

  kb-admin-web:
    build:
      dockerfile: apps/Dockerfile.production
      args:
        VITE_PUBLIC_CONSOLE_ORIGIN: ${PUBLIC_CONSOLE_ORIGIN:?PUBLIC_CONSOLE_ORIGIN is required in production}
        VITE_PUBLIC_ADMIN_ORIGIN: ${PUBLIC_ADMIN_ORIGIN:?PUBLIC_ADMIN_ORIGIN is required in production}
        VITE_PUBLIC_KB_ORIGIN: ${PUBLIC_KB_ORIGIN:?PUBLIC_KB_ORIGIN is required in production}
        VITE_PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:?PUBLIC_API_ORIGIN is required in production}
    ports: !override
      - "127.0.0.1:${KB_ADMIN_WEB_PORT:-5180}:8080"

  edge-gateway:
    ports: !override
      - "127.0.0.1:${PUBLIC_API_PORT:-8088}:8000"
