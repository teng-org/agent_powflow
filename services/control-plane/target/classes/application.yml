spring:
  application:
    name: control-plane
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agentpowflow}
    username: ${SPRING_DATASOURCE_USERNAME:apf}
    password: ${SPRING_DATASOURCE_PASSWORD:apf}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${CONTROL_PLANE_PORT:8080}

control-plane:
  auth:
    admin-username: ${CONTROL_PLANE_ADMIN_USERNAME:${EXECUTION_ADMIN_USERNAME:admin}}
    admin-password: ${CONTROL_PLANE_ADMIN_PASSWORD:${EXECUTION_ADMIN_PASSWORD:admin123}}
    admin-role: ${CONTROL_PLANE_ADMIN_ROLE:${EXECUTION_ADMIN_ROLE:PLATFORM_ADMIN}}
    admin-tenant-id: ${CONTROL_PLANE_ADMIN_TENANT_ID:platform}
    jwt-secret: ${CONTROL_PLANE_JWT_SECRET:${EXECUTION_JWT_SECRET:change-me-in-production}}
    access-ttl-seconds: ${CONTROL_PLANE_ACCESS_TTL_SECONDS:${EXECUTION_JWT_TTL_SECONDS:43200}}
    refresh-ttl-seconds: ${CONTROL_PLANE_REFRESH_TTL_SECONDS:604800}
